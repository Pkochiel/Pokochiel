name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'claude/speed-reading-lab-app-**'
  workflow_dispatch:
    inputs:
      full_e2e:
        description: 'E2E をフルで実行する'
        type: boolean
        default: false

# 同じ ref への連続 push では最新のものだけを走らせる
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # 型・規約・ユニットテスト・本番ビルド。ここが落ちたら E2E は走らせない。
  verify:
    name: typecheck / lint / unit / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 1,100 件超のユニットテストが Regression の主検出器
      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  # Pull Request では所要 1 分程度の smoke のみ。
  e2e-smoke:
    name: E2E (smoke)
    needs: verify
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !contains(fromJSON('["main", "master"]'), github.ref_name)) ||
      (github.event_name == 'workflow_dispatch' && !inputs.full_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E
        run: npm run e2e:smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7

  # 統合先ブランチへの push（＝マージ）では全 E2E。
  e2e-full:
    name: E2E (full)
    needs: verify
    if: >-
      (github.event_name == 'push' && contains(fromJSON('["main", "master"]'), github.ref_name)) ||
      (github.event_name == 'workflow_dispatch' && inputs.full_e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full E2E
        run: npm run e2e:full

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 7
